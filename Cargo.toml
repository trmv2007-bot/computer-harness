[package]
name = "computer-harness"
version = "0.1.0"
edition = "2021"
description = "Persistent cross-platform computer harness runtime"
license = "MIT"

[[bin]]
name = "fairy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cap-std = "4.0.3"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
